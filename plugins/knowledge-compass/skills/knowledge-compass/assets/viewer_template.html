<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领域指南 · knowledge-compass</title>
<style>
  :root{
    --bg:#f4f2ea; --card:#fdfcf9; --ink:#262320; --muted:#6f6a5e;
    --line:#e7e3d8; --accent:#2f5a4a; --gold:#b08d3f;
    --hero1:#1e3a32; --hero2:#16302a; --hero-ink:#ece4d2;
    --serif:Georgia,"Times New Roman","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
    --chip-type:#e7efe9; --chip-type-ink:#2f5a4a;
    --chip-pre:#f3effa; --chip-pre-ink:#6d5aa6;
    --chip-diff:#f7efe2; --chip-diff-ink:#9a6a2e;
    --chip-aud:#eaf1ec; --chip-aud-ink:#3f6b53;
    --chip-free:#eef1ec; --chip-free-ink:#5a6a3f;
    --chip-ok:#e7efe9; --chip-ok-ink:#2f5a4a;
    --chip-warn:#f7ece0; --chip-warn-ink:#9a6a2e;
    --must:#b08d3f; --rec:#9bb0c4; --opt:#d8d3c6;
    --atlas-fog:#eaf0ee;--deep-spruce:#153a35;--meridian-teal:#2f6f68;
    --signal-coral:#dc6a50;--atlas-ink:#1f2926;--atlas-paper:#fbfdfc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
  header.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));
    color:var(--hero-ink);border-radius:14px;padding:30px 30px 26px;
    border:1px solid rgba(176,141,63,.30);box-shadow:0 8px 26px rgba(20,40,30,.22)}
  .hero .kicker{display:inline-block;font-family:var(--serif);font-size:13.5px;font-weight:700;
    letter-spacing:.20em;color:var(--gold);margin:0 0 8px}
  .hero h1{font-family:var(--serif);margin:0;font-size:30px;font-weight:600;
    letter-spacing:.12em;color:#f5efe1}
  .hero h1::after{content:"";display:block;width:56px;height:3px;
    background:var(--gold);margin:14px 0 16px;border-radius:2px}
  .frags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .frag{background:rgba(236,228,210,.08);border:1px solid rgba(236,228,210,.30);
    color:var(--hero-ink);border-radius:6px;padding:3px 11px;font-size:13px}
  .hero .judgment{margin:0;font-size:14.5px;opacity:.92;color:var(--hero-ink)}
  .hero .verdict-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:13px 0 0}
  .hero .conf{display:inline-flex;align-items:center;gap:5px;background:rgba(176,141,63,.18);
    border:1px solid rgba(176,141,63,.55);color:#f0e7d4;border-radius:999px;
    padding:2px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
  .hero .excluded{font-size:13px;opacity:.78;color:var(--hero-ink)}
  .disc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:13px 0 0}
  .disc-row .lab{font-size:12.5px;opacity:.8;color:var(--hero-ink)}
  .disc{background:rgba(176,141,63,.16);border:1px solid rgba(176,141,63,.50);
    color:#f0e7d4;border-radius:6px;padding:2px 11px;font-size:12.5px;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:16px 2px 0;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .info{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:14px 0 6px}
  .info h2{margin:0 0 6px;font-size:13px;color:var(--muted);letter-spacing:.04em;font-weight:600}
  .info p{margin:0;font-size:14.5px}
  .info.prereqs{border-left:4px solid var(--gold)}
  /* 正文引用角标 */
  sup.cite{font-size:11px;line-height:0;margin-left:1px;white-space:nowrap}
  sup.cite a{color:var(--accent);text-decoration:none;font-weight:700}
  sup.cite a:hover{text-decoration:underline}
  /* 视图切换 */
  .viewtoggle{display:inline-flex;gap:4px;margin:20px 2px 2px;background:#ece8dd;
    border:1px solid var(--line);border-radius:9px;padding:3px}
  .viewtoggle button{border:0;background:transparent;color:var(--muted);cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:7px;transition:.15s}
  .viewtoggle button.on{background:var(--accent);color:#fff}
  section.layer{margin-top:26px}
  .layer-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;
    border-bottom:2px solid rgba(176,141,63,.32);margin-bottom:14px}
  .layer-head .emoji{font-size:20px}
  .layer-head h2{font-family:var(--serif);margin:0;font-size:19px;font-weight:700;letter-spacing:.02em}
  .layer-head .sub{color:var(--muted);font-size:13px}
  .cards{display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:12px;padding:15px 17px;box-shadow:0 1px 2px rgba(40,35,20,.04);
    transition:box-shadow .15s,transform .15s}
  .card.must{border-left-color:var(--must)}
  .card.rec{border-left-color:var(--rec)}
  .card.opt{border-left-color:var(--opt)}
  .card:hover{box-shadow:0 6px 18px rgba(40,35,20,.09);transform:translateY(-1px)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .name{font-family:var(--serif);font-size:16.5px;font-weight:600;margin:0;letter-spacing:.01em}
  .card .meta{color:var(--muted);font-size:13px;margin:3px 0 0}
  .prilabel{display:inline-block;margin:0 0 5px;border-radius:4px;padding:2px 10px;
    font-size:12px;font-weight:700;letter-spacing:.02em}
  .prilabel.must{background:var(--gold);color:#fff}
  .prilabel.rec{background:#e3ebf2;color:#3d5a74}
  .prilabel.opt{background:#efece3;color:#6f6a5e}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;justify-content:flex-end}
  .chip{border-radius:4px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
  .chip.type{background:var(--chip-type);color:var(--chip-type-ink)}
  .chip.free{background:var(--chip-free);color:var(--chip-free-ink)}
  .chip.pre{background:var(--chip-pre);color:var(--chip-pre-ink)}
  .chip.diff{background:var(--chip-diff);color:var(--chip-diff-ink)}
  .chip.aud{background:var(--chip-aud);color:var(--chip-aud-ink)}
  .chip.ok{background:var(--chip-ok);color:var(--chip-ok-ink)}
  .chip.warn{background:var(--chip-warn);color:var(--chip-warn-ink);cursor:help}
  .card .reason{margin:9px 0 0;font-size:14px}
  .card .foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
  .btn{margin-left:auto;display:inline-block;text-decoration:none;border:1px solid var(--accent);
    color:var(--accent);border-radius:6px;padding:4px 12px;font-size:13px;font-weight:600}
  .btn:hover{background:var(--accent);color:#fff}
  /* 流程树（学习先后） */
  .tree-hint{color:var(--muted);font-size:12.5px;margin:14px 2px 0}
  .tree{position:relative;margin-top:10px;overflow-x:auto;padding:8px 2px 4px}
  .tree-edges{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
  .tiers{position:relative;z-index:1;display:flex;flex-direction:column;gap:40px;
    min-width:max-content;align-items:stretch}
  .tier{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  .tnode{position:relative;display:block;background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--line);border-radius:10px;padding:10px 14px;width:212px;
    box-shadow:0 1px 2px rgba(40,35,20,.05);text-decoration:none;color:inherit;
    transition:box-shadow .15s,transform .15s}
  .tnode.must{border-left-color:var(--must)}
  .tnode.rec{border-left-color:var(--rec)}
  .tnode.opt{border-left-color:var(--opt)}
  .tnode:hover{box-shadow:0 6px 16px rgba(40,35,20,.10);transform:translateY(-1px)}
  .tnode .tn-name{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.35}
  .tnode .tn-meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .plan{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);
    border:1px solid rgba(176,141,63,.28);border-radius:14px;
    padding:24px 26px;margin-top:32px;box-shadow:0 8px 24px rgba(20,40,30,.20)}
  .plan h2{font-family:var(--serif);margin:0 0 5px;font-size:17px;letter-spacing:.04em;color:#f5efe1}
  .plan .hint{font-size:12px;opacity:.7;margin:0 0 12px}
  .plan .progress{height:5px;border-radius:999px;background:rgba(176,141,63,.22);
    overflow:hidden;margin:0 0 18px}
  .plan .progress>i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
  .step{position:relative;padding-left:42px;padding-bottom:18px;cursor:pointer}
  .step:last-child{padding-bottom:0}
  .step::before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;
    border-radius:50%;background:rgba(176,141,63,.22);border:1px solid rgba(176,141,63,.55);
    color:#f5efe1;font-family:var(--serif);font-weight:700;font-size:13px;
    text-align:center;line-height:27px;transition:background .15s}
  .step.done::before{content:"✓";background:var(--gold);border-color:var(--gold);color:#1e3a32}
  .step:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:30px;bottom:0;
    width:1px;background:rgba(176,141,63,.35)}
  .step-title{font-weight:700;font-size:14.5px;margin:3px 0 4px;color:#f5efe1}
  .step.done .step-title{text-decoration:line-through;opacity:.6}
  .step-detail{font-size:13.5px;opacity:.9;white-space:pre-wrap}
  .step.done .step-detail{opacity:.5}
  .route{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);
    border:1px solid rgba(176,141,63,.28);border-radius:14px;
    padding:20px 22px;margin-top:30px;box-shadow:0 8px 24px rgba(20,40,30,.20)}
  .route h2{font-family:var(--serif);margin:0 0 8px;font-size:16px;color:#f5efe1}
  .route p{margin:0;font-size:14.5px;white-space:pre-wrap;opacity:.95}
  /* 参考来源 */
  .refs{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-top:30px}
  .refs h2{font-family:var(--serif);margin:0 0 4px;font-size:16px;letter-spacing:.02em}
  .refs .refs-hint{margin:0 0 12px;font-size:12px;color:var(--muted)}
  .refs ol{margin:0;padding-left:24px}
  .refs li{font-size:13.5px;margin:0 0 9px;line-height:1.55;scroll-margin-top:16px}
  .refs li:target{background:#fbf4df;border-radius:5px;box-shadow:0 0 0 6px #fbf4df}
  .refs .ref-title{font-weight:600}
  .refs .ref-src{color:var(--muted)}
  .refs .ref-link{margin-left:8px;color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px}
  .refs .ref-link:hover{text-decoration:underline}
  .refs .ref-note{color:var(--muted)}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
  footer code{background:#ece8dd;padding:1px 6px;border-radius:5px}
  .empty{color:var(--muted);font-size:13px;font-style:italic}

  /* 零安装入口：离线罗盘校准台。仅原始模板打开时呈现。 */
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important}
  body.import-mode{background:var(--atlas-fog);color:var(--atlas-ink)}
  body.import-mode .wrap{max-width:1120px;padding:26px 24px 56px}
  .calibration-shell{min-height:calc(100vh - 82px);display:flex;flex-direction:column}
  .calibration-head{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:4px 2px 22px;border-bottom:1px solid rgba(21,58,53,.16)}
  .calibration-brand{display:flex;align-items:baseline;gap:12px;color:var(--deep-spruce)}
  .calibration-brand strong{font-family:"Iowan Old Style",Georgia,"Songti SC",serif;
    font-size:20px;letter-spacing:.02em}
  .calibration-brand span,.privacy-note{font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.08em;text-transform:uppercase;color:var(--meridian-teal)}
  .privacy-note{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.02em}
  .privacy-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--meridian-teal);
    box-shadow:0 0 0 4px rgba(47,111,104,.12)}
  .calibration-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);
    gap:48px;align-items:center;flex:1;padding:46px 0 34px}
  .calibration-copy .eyebrow{margin:0 0 10px;color:var(--signal-coral);
    font:700 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em}
  .calibration-copy h1{margin:0;max-width:650px;color:var(--deep-spruce);
    font-family:"Iowan Old Style",Georgia,"Songti SC",serif;font-size:clamp(34px,5vw,62px);
    font-weight:600;line-height:1.08;letter-spacing:-.025em}
  .calibration-copy .lead{max-width:620px;margin:18px 0 28px;color:#42615c;font-size:16px}
  .dropzone{position:relative;min-height:300px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;padding:34px;border:2px dashed rgba(47,111,104,.46);
    border-radius:24px;background:rgba(251,253,252,.72);cursor:pointer;text-align:center;
    box-shadow:0 20px 60px rgba(21,58,53,.08);transition:border-color .2s,background .2s,transform .2s}
  .dropzone:hover,.dropzone.is-dragging{border-color:var(--signal-coral);background:var(--atlas-paper);
    transform:translateY(-2px)}
  .dropzone:focus-visible,.calibration-button:focus-visible,.toolbar-button:focus-visible,
  .viewtoggle button:focus-visible,.step:focus-visible{outline:3px solid var(--signal-coral);outline-offset:4px}
  .compass{position:relative;width:112px;height:112px;border:1px solid rgba(47,111,104,.5);
    border-radius:50%;background:radial-gradient(circle at center,transparent 0 9%,rgba(47,111,104,.1) 10% 11%,
    transparent 12% 47%,rgba(47,111,104,.1) 48% 49%,transparent 50%);box-shadow:inset 0 0 0 10px rgba(47,111,104,.04)}
  .compass::before,.compass::after{content:"";position:absolute;background:rgba(47,111,104,.28)}
  .compass::before{width:1px;height:82%;left:50%;top:9%}
  .compass::after{height:1px;width:82%;left:9%;top:50%}
  .compass-needle{position:absolute;z-index:1;left:50%;top:50%;width:18px;height:80px;
    transform:translate(-50%,-50%) rotate(24deg);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  .compass-needle::before,.compass-needle::after{content:"";position:absolute;left:1px;border-left:8px solid transparent;
    border-right:8px solid transparent}
  .compass-needle::before{top:0;border-bottom:36px solid var(--signal-coral)}
  .compass-needle::after{bottom:0;border-top:36px solid var(--deep-spruce)}
  .dropzone.is-dragging .compass-needle{transform:translate(-50%,-50%) rotate(66deg)}
  .drop-title{margin:4px 0 0;color:var(--deep-spruce);font-size:19px;font-weight:750}
  .drop-help{margin:0;color:#58706c;font-size:13px}
  .calibration-button,.toolbar-button{min-height:44px;border:0;border-radius:10px;padding:10px 18px;
    background:var(--deep-spruce);color:#fff;font-family:inherit;font-size:14px;font-weight:700;line-height:1.4;cursor:pointer}
  .calibration-button:hover,.toolbar-button:hover{background:var(--meridian-teal)}
  .steps-panel{padding:8px 0}
  .steps-panel h2{margin:0 0 18px;color:var(--deep-spruce);font-size:13px;letter-spacing:.08em}
  .calibration-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .calibration-steps li{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:start;
    padding:15px 0;border-bottom:1px solid rgba(21,58,53,.14)}
  .step-number{color:var(--signal-coral);font:700 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.1em}
  .calibration-steps strong{display:block;color:var(--deep-spruce);font-size:15px}
  .calibration-steps p{margin:3px 0 0;color:#58706c;font-size:13px}
  .import-status{min-height:48px;margin-top:20px;padding:12px 14px;border-left:3px solid var(--meridian-teal);
    background:rgba(251,253,252,.75);color:#3e5b56;font-size:13px;white-space:pre-wrap}
  .import-status.error{border-left-color:var(--signal-coral);color:#7d382b;background:#fff7f5}
  .import-foot{margin:0;color:#66807b;font:500 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  .portable-toolbar{position:sticky;z-index:5;top:10px;display:flex;align-items:center;gap:12px;
    margin:0 0 18px;padding:10px 12px;border:1px solid rgba(21,58,53,.17);border-radius:12px;
    background:rgba(251,253,252,.94);box-shadow:0 10px 28px rgba(21,58,53,.12);backdrop-filter:blur(8px)}
  .portable-toolbar .toolbar-status{min-width:0;margin-right:auto;color:var(--deep-spruce);font-size:13px}
  .portable-toolbar .toolbar-status strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .portable-toolbar .toolbar-status span{color:#66807b;font-size:11px}
  .toolbar-button.secondary{border:1px solid rgba(21,58,53,.28);background:transparent;color:var(--deep-spruce)}
  .toolbar-button.secondary:hover{background:var(--atlas-fog)}
  .toolbar-button:disabled{cursor:not-allowed;opacity:.48}
  @media(max-width:760px){
    body.import-mode .wrap{padding:18px 16px 42px}
    .calibration-head{align-items:flex-start;flex-direction:column;gap:8px;padding-bottom:16px}
    .calibration-grid{grid-template-columns:1fr;gap:28px;padding:30px 0 24px}
    .dropzone{min-height:264px;padding:26px 18px}.steps-panel{padding:0}
    .portable-toolbar{position:static;align-items:stretch;flex-wrap:wrap}
    .portable-toolbar .toolbar-status{flex:1 1 100%}.toolbar-button{flex:1}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
    .dropzone:hover,.dropzone.is-dragging{transform:none}
    .dropzone.is-dragging .compass-needle{transform:translate(-50%,-50%) rotate(24deg)}
  }
</style>
</head>

<script>
"use strict";

const DATA_MARKER = "/" + "*__PATH_DATA__*" + "/";
const MAX_JSON_BYTES = 5 * 1024 * 1024;
let CURRENT_DATA = null;
let CURRENT_FILE_NAME = "";
let ROUTE_RESIZE_HANDLER = null;
let EXPORT_SKELETON = null;

const PRI = {
  "必读": {c:"must", t:"★ 必读"},
  "推荐": {c:"rec",  t:"推荐"},
  "可选": {c:"opt",  t:"可选"}
};

// 参考来源（顶层 references），在 render() 起始赋值；appendRich 据它解析正文 [n] 角标。
let REFS = [];

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function chip(cls, text){ return text ? el("span", "chip " + cls, text) : null; }
function hasUnsafeControl(value){
  if(typeof value !== "string") return false;
  for(let i = 0; i < value.length; i++){
    const code = value.charCodeAt(i);
    if(code <= 0x1f || (code >= 0x7f && code <= 0x9f)) return true;
    if(code >= 0xd800 && code <= 0xdbff){
      const next = value.charCodeAt(i + 1);
      if(!(next >= 0xdc00 && next <= 0xdfff)) return true;
      i++;
    } else if(code >= 0xdc00 && code <= 0xdfff){
      return true;
    }
  }
  return false;
}
function isValidWebHostname(value){
  if(!value || value.includes("%")) return false;
  const hostname = value.endsWith(".") ? value.slice(0,-1) : value;
  if(!hostname || Array.from(hostname).length > 253) return false;
  const labels = hostname.split(".");
  if(labels.some(label => !label || Array.from(label).length > 63)) return false;
  if(/^[0-9.]+$/.test(hostname)){
    return labels.length === 4 && labels.every(label =>
      /^[0-9]+$/.test(label) && (label === "0" || !label.startsWith("0")) && Number(label) <= 255
    );
  }
  return labels.every(label => /^[\p{L}\p{M}\p{N}_-]+$/u.test(label));
}
function isSafeWebUrl(value){
  if(typeof value !== "string" || !value.trim() || hasUnsafeControl(value) || value.includes("\uFEFF")) return false;
  const trimmed = value.trim();
  // This explicit, conservative grammar is mirrored in view_field_guide.py.
  // Do not delegate acceptance to WHATWG/urllib: their malformed-host behavior differs.
  if(/[\s\\]/u.test(trimmed)) return false;
  const scheme = /^https?:\/\//i.exec(trimmed);
  if(!scheme) return false;
  const remainder = trimmed.slice(scheme[0].length);
  const boundary = remainder.search(/[/?#]/);
  const authority = boundary < 0 ? remainder : remainder.slice(0,boundary);
  if(!authority || /[<>"`{}|^]/u.test(authority)) return false;
  const hostPort = authority.slice(authority.lastIndexOf("@") + 1);
  if(!hostPort) return false;

  let hostname, port = null;
  if(hostPort.startsWith("[")){
    const close = hostPort.indexOf("]");
    if(close <= 1) return false;
    hostname = hostPort.slice(1,close);
    if(hostname.includes("%")) return false;
    const tail = hostPort.slice(close + 1);
    if(tail && !tail.startsWith(":")) return false;
    port = tail ? tail.slice(1) : null;
    try {
      const parsed = new URL("http://[" + hostname + "]/" );
      if(!parsed.hostname) return false;
    } catch (_) {
      return false;
    }
  } else {
    const colon = hostPort.lastIndexOf(":");
    if(colon >= 0){
      hostname = hostPort.slice(0,colon);
      port = hostPort.slice(colon + 1);
      if(hostname.includes(":")) return false;
    } else {
      hostname = hostPort;
    }
    if(!isValidWebHostname(hostname)) return false;
  }
  return port === null || (/^[0-9]+$/.test(port) && Number(port) <= 65535);
}
function safeHttpUrl(value){
  if(!isSafeWebUrl(value)) return null;
  try {
    return new URL(value.trim()).href;
  } catch (_) {
    return null;
  }
}

function isRecord(value){
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

function isValidResourceId(value){
  return typeof value === "string" && /^[a-z0-9][a-z0-9._-]{0,63}$/.test(value) &&
    value !== "__proto__" && value !== "prototype" && value !== "constructor";
}

// 浏览器信任边界：与 scripts/view_field_guide.py:validate_guide 保持同一接受/拒绝语义。
function validateGuideInBrowser(data){
  const errors = [];
  if(!isRecord(data)) return ["top level must be a JSON object"];

  if(typeof data.topic !== "string" || !data.topic.trim()){
    errors.push("topic must be a non-empty string");
  } else if(hasUnsafeControl(data.topic)){
    errors.push("topic must not contain control characters");
  }

  ["domain","domain_judgment","confidence","excluded","overview","prerequisites","route"].forEach(key => {
    if(Object.prototype.hasOwnProperty.call(data, key) && typeof data[key] !== "string"){
      errors.push(key + " must be a string");
    }
  });

  if(!Array.isArray(data.layers) || data.layers.length === 0){
    errors.push("layers must be a non-empty array");
    return errors;
  }

  const resourceIds = new Map();
  const dependencies = [];
  data.layers.forEach((layer, layerIndex) => {
    const layerPath = "layers[" + layerIndex + "]";
    if(!isRecord(layer)){
      errors.push(layerPath + " must be an object");
      return;
    }
    ["emoji","title","subtitle"].forEach(key => {
      if(Object.prototype.hasOwnProperty.call(layer, key) && typeof layer[key] !== "string"){
        errors.push(layerPath + "." + key + " must be a string");
      }
    });
    if(!Array.isArray(layer.resources)){
      errors.push(layerPath + ".resources must be an array");
      return;
    }
    layer.resources.forEach((resource, resourceIndex) => {
      const resourcePath = layerPath + ".resources[" + resourceIndex + "]";
      if(!isRecord(resource)){
        errors.push(resourcePath + " must be an object");
        return;
      }
      if(Object.prototype.hasOwnProperty.call(resource, "url") && !isSafeWebUrl(resource.url)){
        errors.push(resourcePath + ".url must be an absolute http(s) URL");
      }
      if(Object.prototype.hasOwnProperty.call(resource, "verified") && typeof resource.verified !== "boolean"){
        errors.push(resourcePath + ".verified must be true or false");
      }
      if(Object.prototype.hasOwnProperty.call(resource, "free") && typeof resource.free !== "boolean"){
        errors.push(resourcePath + ".free must be true or false");
      }
      ["name","meta","type","priority","prereq","reason","difficulty","audience","verify_note"].forEach(key => {
        if(Object.prototype.hasOwnProperty.call(resource, key) && typeof resource[key] !== "string"){
          errors.push(resourcePath + "." + key + " must be a string");
        }
      });
      if(resource.priority != null && resource.priority !== "必读" && resource.priority !== "推荐" && resource.priority !== "可选"){
        errors.push(resourcePath + ".priority must be 必读, 推荐, or 可选");
      }

      const resourceId = resource.id;
      let resourceIdValid = resourceId == null;
      if(resourceId != null){
        if(!isValidResourceId(resourceId)){
          errors.push(resourcePath + ".id must use 1-64 lowercase letters, digits, '.', '_' or '-' and must not be a reserved object key");
        } else if(resourceIds.has(resourceId)){
          errors.push(resourcePath + ".id duplicates " + resourceIds.get(resourceId) + ": " + resourceId);
        } else {
          resourceIds.set(resourceId, resourcePath + ".id");
          resourceIdValid = true;
        }
      }

      const requires = Object.prototype.hasOwnProperty.call(resource,"requires") ? resource.requires : [];
      if(!Array.isArray(requires) || requires.some(item => !isValidResourceId(item))){
        errors.push(resourcePath + ".requires must be an array of valid, non-reserved resource ids");
      } else if(resourceIdValid && typeof resourceId === "string"){
        dependencies.push({id:resourceId, requires:requires, path:resourcePath});
      } else if(requires.length){
        errors.push(resourcePath + ".id is required when requires is non-empty");
      }
    });
  });

  dependencies.forEach(item => {
    item.requires.forEach(requiredId => {
      if(requiredId === item.id){
        errors.push(item.path + ".requires cannot reference itself: " + item.id);
      } else if(!resourceIds.has(requiredId)){
        errors.push(item.path + ".requires references unknown id: " + requiredId);
      }
    });
  });

  const dependencyMap = new Map(dependencies.map(item => [item.id, item.requires]));
  const visiting = new Set();
  const visited = new Set();
  function visit(resourceId, trail){
    if(visiting.has(resourceId)){
      errors.push("requires contains a cycle: " + trail.concat([resourceId]).join(" -> "));
      return;
    }
    if(visited.has(resourceId)) return;
    visiting.add(resourceId);
    (dependencyMap.get(resourceId) || []).forEach(requiredId => {
      if(dependencyMap.has(requiredId)) visit(requiredId, trail.concat([resourceId]));
    });
    visiting.delete(resourceId);
    visited.add(resourceId);
  }
  dependencyMap.forEach((_, resourceId) => visit(resourceId, []));

  const references = Object.prototype.hasOwnProperty.call(data,"references") ? data.references : [];
  if(!Array.isArray(references)){
    errors.push("references must be an array");
  } else {
    references.forEach((reference, index) => {
      const path = "references[" + index + "]";
      if(!isRecord(reference)){
        errors.push(path + " must be an object");
        return;
      }
      if(Object.prototype.hasOwnProperty.call(reference, "url") && !isSafeWebUrl(reference.url)){
        errors.push(path + ".url must be an absolute http(s) URL");
      }
      ["title","name","source","note"].forEach(key => {
        if(Object.prototype.hasOwnProperty.call(reference, key) && typeof reference[key] !== "string"){
          errors.push(path + "." + key + " must be a string");
        }
      });
    });
  }

  const plan = Object.prototype.hasOwnProperty.call(data,"plan") ? data.plan : [];
  if(!Array.isArray(plan)){
    errors.push("plan must be an array");
  } else {
    plan.forEach((step, index) => {
      if(!isRecord(step)){
        errors.push("plan[" + index + "] must be an object");
        return;
      }
      ["step","title","detail"].forEach(key => {
        if(Object.prototype.hasOwnProperty.call(step, key) && typeof step[key] !== "string"){
          errors.push("plan[" + index + "]." + key + " must be a string");
        }
      });
    });
  }

  ["fragments","disciplines"].forEach(key => {
    const value = Object.prototype.hasOwnProperty.call(data,key) ? data[key] : [];
    if(!Array.isArray(value) || value.some(item => typeof item !== "string")){
      errors.push(key + " must be an array of strings");
    }
  });
  return errors;
}

function canonicalJson(value){
  if(Array.isArray(value)) return "[" + value.map(canonicalJson).join(",") + "]";
  if(isRecord(value)){
    return "{" + Object.keys(value).sort().map(key => JSON.stringify(key) + ":" + canonicalJson(value[key])).join(",") + "}";
  }
  return JSON.stringify(value);
}

function browserStorageKey(data){
  const clean = Object.create(null);
  Object.keys(data).forEach(key => { if(key !== "_storage_key") clean[key] = data[key]; });
  const source = canonicalJson(clean);
  let left = 0x811c9dc5, right = 0x9e3779b9;
  for(let i = 0; i < source.length; i++){
    const code = source.charCodeAt(i);
    left = Math.imul(left ^ code, 0x01000193) >>> 0;
    right = Math.imul(right ^ (code + i), 0x85ebca6b) >>> 0;
  }
  // butler-min: 该 64-bit 非加密组合哈希只隔离本地进度；若观察到真实碰撞或用于身份/安全边界，升级为 SHA-256。
  return "browser-" + left.toString(16).padStart(8,"0") + right.toString(16).padStart(8,"0");
}

function jsonForHtml(data){
  return JSON.stringify(data).replace(/&/g,"\\u0026").replace(/</g,"\\u003c").replace(/>/g,"\\u003e")
    .replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
}

async function importGuideFile(file){
  const sequence = ++IMPORT_SEQUENCE;
  renderImporter("正在读取并检查 “" + (file && file.name ? file.name : "所选文件") + "”…", false);
  try {
    if(!file) throw new Error("没有读到文件，请重新选择。");
    if(file.size === 0) throw new Error("这个文件是空的，请选择包含指南内容的 JSON。");
    if(file.size > MAX_JSON_BYTES) throw new Error("文件超过 5 MB 上限。请缩小 JSON 后再试。");
    if(typeof TextDecoder !== "function") throw new Error("这个浏览器太旧，无法安全读取 UTF-8 JSON。请换用较新的浏览器。");
    const bytes = await file.arrayBuffer();
    if(sequence !== IMPORT_SEQUENCE) return;
    const text = new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    let data;
    try { data = JSON.parse(text); }
    catch (_) { throw new Error("JSON 格式不正确。请检查逗号、引号和括号后重新选择。"); }
    const errors = validateGuideInBrowser(data);
    if(errors.length){
      const visible = errors.slice(0,8).map((item,index) => (index + 1) + ". " + item).join("\n");
      const more = errors.length > 8 ? "\n另有 " + (errors.length - 8) + " 个问题。" : "";
      throw new Error("这个 JSON 还不能生成指南：\n" + visible + more);
    }
    data._storage_key = browserStorageKey(data);
    CURRENT_DATA = data;
    CURRENT_FILE_NAME = file.name || "guide.json";
    render(data);
    renderPortableToolbar(CURRENT_FILE_NAME);
  } catch (error){
    if(sequence === IMPORT_SEQUENCE) renderImporter(formatImportError(error), true);
  }
}

function safeDownloadName(topic){
  const base = String(topic || "knowledge-compass-guide").normalize ? String(topic || "knowledge-compass-guide").normalize("NFKC") : String(topic || "knowledge-compass-guide");
  let cleaned = Array.from(base.replace(/[\u0000-\u001f\u007f<>:\"/\\|?*]+/g,"-").trim().replace(/^\.+|\.+$/g,"")).slice(0,100).join("");
  if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(cleaned)) cleaned = "guide-" + cleaned;
  return (cleaned || "knowledge-compass-guide") + ".html";
}

function exportStandaloneHtml(data){
  const errors = validateGuideInBrowser(data);
  if(errors.length) throw new Error("当前指南未通过检查，不能导出。");
  if(!EXPORT_SKELETON) throw new Error("页面导出骨架不可用，请重新打开 viewer 后再试。");
  const root = EXPORT_SKELETON.cloneNode(true);
  const slots = root.querySelectorAll("#kc-guide-data");
  if(slots.length !== 1) throw new Error("页面数据槽异常，已停止导出。请重新获取 viewer 文件。");
  slots[0].textContent = jsonForHtml(data);
  const app = root.querySelector("#app");
  if(!app) throw new Error("页面结构不完整，已停止导出。请重新获取 viewer 文件。");
  app.replaceChildren();
  const body = root.querySelector("body");
  if(body) body.removeAttribute("class");
  const title = root.querySelector("title");
  if(title) title.textContent = (data.topic || "领域指南") + " · 领域指南";
  return "<!DOCTYPE html>\n" + root.outerHTML;
}

function downloadStandalone(){
  try {
    if(!CURRENT_DATA) throw new Error("请先选择并通过检查的 JSON。");
    if(typeof Blob !== "function" || !window.URL || typeof URL.createObjectURL !== "function"){
      throw new Error("这个浏览器不支持本地下载。JSON 已保留，请换用较新的浏览器重试。");

    const anchor = document.createElement("a");
    anchor.href = objectUrl; anchor.download = safeDownloadName(CURRENT_DATA.topic);
    anchor.style.display = "none"; document.body.appendChild(anchor); anchor.click(); anchor.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl),0);
    updateToolbarStatus("导出已开始。下载完成后可直接双击 HTML 打开。",false);

// 把含 [n] 角标的正文渲染进 parent：仅当第 n 条 reference 存在时才链到 #ref-n，否则原样保留为文字。
// 纯 DOM 构造（textContent / createTextNode），不拼 innerHTML，杜绝 XSS。
function appendRich(parent, text){
  if(text == null) return;
  const str = String(text);
  const re = /\[(\d+)\]/g;
  let last = 0, m;
  while((m = re.exec(str)) !== null){
    const n = parseInt(m[1], 10);
    if(n >= 1 && n <= REFS.length){
      if(m.index > last) parent.appendChild(document.createTextNode(str.slice(last, m.index)));
      const sup = el("sup", "cite");
      const a = el("a", null, "[" + n + "]");
      a.href = "#ref-" + n;
      sup.appendChild(a);
      parent.appendChild(sup);
      last = m.index + m[0].length;
    }
    // 无对应 reference：不前移 last，让该 [n] 留在后续文本块里照常显示
  }
  if(last < str.length) parent.appendChild(document.createTextNode(str.slice(last)));
}
function richP(cls, text){ const p = el("p", cls); appendRich(p, text); return p; }

// ---- 流程树（学习先后 / 前后置依赖）----
// 每个 resource 可带 id 与 requires:[id]（作为前置的其他资源）。只有参与依赖关系的资源进树。
function buildGraph(data){
  const byId = new Map();
  (data.layers || []).forEach(layer => (layer.resources || []).forEach(r => {
    if(r.id != null && r.id !== "") byId.set(r.id, r);
  }));
  const edges = [];   // {from: 前置 id, to: 后置 id}
  byId.forEach((resource, id) => {
    const reqs = resource.requires;
    if(Array.isArray(reqs)) reqs.forEach(req => {
      if(byId.has(req) && req !== id) edges.push({from: req, to: id});
    });
  });
  const part = new Set();
  edges.forEach(e => { part.add(e.from); part.add(e.to); });
  return {byId, edges, part};
}

function computeTiers(part, edges){
  const preds = new Map();
  part.forEach(id => { preds.set(id, []); });
  edges.forEach(e => { if(part.has(e.from) && part.has(e.to)) preds.get(e.to).push(e.from); });
  const tier = new Map(), visiting = new Set();
  function depth(id){
    if(tier.has(id)) return tier.get(id);
    if(visiting.has(id)) return 0;             // 环保护：遇到回边按 0 处理
    visiting.add(id);
    let d = 0;
    preds.get(id).forEach(p => { d = Math.max(d, depth(p) + 1); });
    visiting.delete(id);
    tier.set(id, d);
    return d;
  }
  part.forEach(id => depth(id));
  return tier;
}

function renderTree(graph, container){
  const {byId, edges, part} = graph;
  const tierMap = computeTiers(part, edges);
  let maxTier = 0;
  part.forEach(id => { if(tierMap.get(id) > maxTier) maxTier = tierMap.get(id); });

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "tree-edges");
  const defs = document.createElementNS(svgNS, "defs");
  const marker = document.createElementNS(svgNS, "marker");
  marker.setAttribute("id", "kc-arrow");
  marker.setAttribute("markerWidth", "9"); marker.setAttribute("markerHeight", "9");
  marker.setAttribute("refX", "7"); marker.setAttribute("refY", "3");
  marker.setAttribute("orient", "auto"); marker.setAttribute("markerUnits", "userSpaceOnUse");
  const mpath = document.createElementNS(svgNS, "path");
  mpath.setAttribute("d", "M0,0 L7,3 L0,6 Z"); mpath.setAttribute("fill", "#b08d3f");
  marker.appendChild(mpath); defs.appendChild(marker); svg.appendChild(defs);
  container.appendChild(svg);

  const tiers = el("div","tiers");
  const rows = [];
  for(let t = 0; t <= maxTier; t++){ rows[t] = el("div","tier"); }
  const nodeEls = new Map();
  part.forEach(id => {
    const r = byId.get(id);
    const pr = PRI[r.priority];
    const resourceUrl = safeHttpUrl(r.url);
    const node = el(resourceUrl ? "a" : "div", "tnode" + (pr ? " " + pr.c : ""));
    if(resourceUrl){ node.href = resourceUrl; node.target = "_blank"; node.rel = "noopener noreferrer"; }
    node.appendChild(el("div","tn-name", r.name || id));
    const meta = el("div","tn-meta");
    if(r.type) meta.appendChild(el("span", null, r.type));
    if(pr) meta.appendChild(el("span", null, pr.t));
    if(meta.childNodes.length) node.appendChild(meta);
    nodeEls.set(id, node);
    rows[tierMap.get(id) || 0].appendChild(node);
  });
  rows.forEach(row => { if(row.childNodes.length) tiers.appendChild(row); });
  container.appendChild(tiers);

  function draw(){
    Array.prototype.slice.call(svg.querySelectorAll("path.edge")).forEach(p => p.remove());
    const crect = container.getBoundingClientRect();
    const w = container.scrollWidth, h = container.scrollHeight;
    svg.setAttribute("width", w); svg.setAttribute("height", h);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    edges.forEach(e => {
      const fe = nodeEls.get(e.from), te = nodeEls.get(e.to);
      if(!fe || !te) return;
      const a = fe.getBoundingClientRect(), b = te.getBoundingClientRect();
      const x1 = a.left - crect.left + container.scrollLeft + a.width / 2;
      const y1 = a.bottom - crect.top + container.scrollTop;
      const x2 = b.left - crect.left + container.scrollLeft + b.width / 2;
      const y2 = b.top - crect.top + container.scrollTop;
      const my = (y1 + y2) / 2;
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("class", "edge");
      path.setAttribute("d", "M" + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + (y2 - 7));
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "rgba(176,141,63,.62)");
      path.setAttribute("stroke-width", "1.6");
      path.setAttribute("marker-end", "url(#kc-arrow)");
      svg.appendChild(path);
    });
  }
  return draw;
}

function makeToggle(layersView, treeView, onShowTree){
  const wrap = el("div","viewtoggle");
  const b1 = el("button", "on", "📚 分层视图");
  const b2 = el("button", null, "🌳 学习路线树");
  function show(tree){
    layersView.style.display = tree ? "none" : "";
    treeView.style.display = tree ? "" : "none";
    b1.classList.toggle("on", !tree);
    b2.classList.toggle("on", tree);
    if(tree && onShowTree) requestAnimationFrame(onShowTree);   // 可见后才有布局，此时再画连线
  }
  b1.addEventListener("click", ()=>show(false));
  b2.addEventListener("click", ()=>show(true));
  wrap.appendChild(b1); wrap.appendChild(b2);
  return wrap;
}

function localStorageAvailable(){
  const probe = "knowledge-compass:storage-probe:" + Date.now() + ":" + Math.random();
  try {
    localStorage.setItem(probe,"1");
    localStorage.removeItem(probe);
    return true;
  } catch (_) {
    return false;
  }
}

function renderPlan(plan, storageKey){
  const box = el("div","plan");
  box.appendChild(el("h2", null, "📋 分阶段学习计划"));
  let persistenceAvailable = localStorageAvailable();
  const volatileProgress = new Map();
  box.appendChild(el("p","hint",persistenceAvailable ?
    "点击任一阶段标记完成 · 进度自动记在本浏览器" :
    "点击任一阶段标记完成 · 浏览器未开放存储，进度仅在当前页面保留"));
  const prog = el("div","progress"); const bar = el("i"); prog.appendChild(bar); box.appendChild(prog);
  const keyFor = (i)=>"knowledge-compass:"+(storageKey||"")+":step:"+i;
  const readProgress = (key)=>{
    if(!persistenceAvailable) return volatileProgress.get(key) || null;
    try { return localStorage.getItem(key); }
    catch (_) { persistenceAvailable = false; return volatileProgress.get(key) || null; }
  };
  const writeProgress = (key,value)=>{
    volatileProgress.set(key,value);
    if(!persistenceAvailable) return;
    try { localStorage.setItem(key,value); }
    catch (_) { persistenceAvailable = false; }
  };
  function refresh(){
    let done = 0;
    plan.forEach((_,i)=>{ if(readProgress(keyFor(i))==="1") done++; });
    bar.style.width = Math.round(done/(plan.length||1)*100) + "%";
  }
  plan.forEach((s, i) => {
    const step = el("div","step");
    step.setAttribute("data-n", String(i + 1));
    step.tabIndex = 0; step.setAttribute("role","checkbox");
    if(readProgress(keyFor(i))==="1") step.classList.add("done");
    step.setAttribute("aria-checked",step.classList.contains("done") ? "true" : "false");
    if(s.step || s.title) step.appendChild(el("div","step-title", s.step || s.title));
    if(s.detail){ const det = el("div","step-detail"); appendRich(det, s.detail); step.appendChild(det); }
    function toggleStep(){
      const now = step.classList.toggle("done");
      step.setAttribute("aria-checked",now ? "true" : "false");
      writeProgress(keyFor(i), now ? "1" : "0");
      refresh();
    }
    step.addEventListener("click",toggleStep);
    step.addEventListener("keydown",event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault(); toggleStep();
      }
    });
    box.appendChild(step);
  });
  refresh();
  return box;
}

function renderReferences(refs){
  const box = el("section","refs");
  box.appendChild(el("h2", null, "参考来源"));
  box.appendChild(el("p","refs-hint","正文 [n] 角标对应下列条目 · 均为本指南分析所依据的可溯出处"));
  const ol = el("ol");
  refs.forEach((r, i) => {
    const li = el("li"); li.id = "ref-" + (i + 1);
    li.appendChild(el("span","ref-title", r.title || r.name || ("来源 " + (i + 1))));
    if(r.source) li.appendChild(el("span","ref-src", " · " + r.source));
    const referenceUrl = safeHttpUrl(r.url);
    if(referenceUrl){
      const a = el("a","ref-link","链接 ↗");
      a.href = referenceUrl; a.target = "_blank"; a.rel = "noopener noreferrer";
      li.appendChild(a);
    }
    if(r.note) li.appendChild(el("span","ref-note", " — " + r.note));
    ol.appendChild(li);
  });
  box.appendChild(ol);
  return box;
}

function infoCard(cls, title, text){
  const c = el("div", "info" + (cls ? (" " + cls) : ""));
  c.appendChild(el("h2", null, title));
  c.appendChild(richP(null, text));
  return c;
}

function render(data){
  resetRenderSurface();
  document.body.classList.remove("import-mode");
  const app = document.getElementById("app");
  REFS = Array.isArray(data.references) ? data.references : [];

  const hero = el("header","hero");
  if(data.domain) hero.appendChild(el("div","kicker", data.domain));   // 领域眉题：直接点明反推出的领域+分支
  hero.appendChild(el("h1", null, data.topic || "领域指南"));
  if(Array.isArray(data.fragments) && data.fragments.length){
    const fr = el("div","frags");
    data.fragments.forEach(f => fr.appendChild(el("span","frag", f)));
    hero.appendChild(fr);
  }
  if(data.domain_judgment) hero.appendChild(richP("judgment", data.domain_judgment));
  // 置信度 + 排除/不匹配（compass 的反幻觉判定，融进 hero）
  const vl = el("div","verdict-line");
  if(data.confidence) vl.appendChild(el("span","conf","置信度 " + data.confidence));
  if(data.excluded){
    const ex = el("span","excluded");
    ex.appendChild(document.createTextNode("未纳入："));
    appendRich(ex, data.excluded);
    vl.appendChild(ex);
  }
  if(vl.childNodes.length) hero.appendChild(vl);
  if(Array.isArray(data.disciplines) && data.disciplines.length){
    const dr = el("div","disc-row");
    dr.appendChild(el("span","lab","📚 学科归属"));
    data.disciplines.forEach(d => dr.appendChild(el("span","disc", d)));
    hero.appendChild(dr);
  }
  app.appendChild(hero);

  // 优先级图例
  const lg = el("div","legend");
  [["must","★ 必读 · 绕不开"],["rec","推荐 · 很好的补充"],["opt","可选 · 按需取用"]].forEach(([c,txt])=>{
    const s = el("span");
    const d = el("span","dot"); d.style.background = "var(--" + c + ")";
    s.appendChild(d); s.appendChild(el("span", null, txt));
    lg.appendChild(s);
  });
  app.appendChild(lg);

  if(data.overview) app.appendChild(infoCard(null, "领域速览", data.overview));
  if(data.prerequisites) app.appendChild(infoCard("prereqs", "🎒 开始之前 · 前置知识", data.prerequisites));

  // 两种视图：默认分层视图，资源间存在前后置依赖时提供「学习路线树」切换
  const graph = buildGraph(data);
  const hasTree = graph.edges.length > 0;

  const layersView = el("div"); layersView.id = "layers-view";
  (data.layers || []).forEach(l => layersView.appendChild(renderLayer(l)));

  let treeView = null, drawEdges = null;
  if(hasTree){
    treeView = el("div"); treeView.id = "tree-view"; treeView.style.display = "none";
    treeView.appendChild(el("p","tree-hint","按学习先后排布：顶层可任意起步，箭头指向应在其之后学习的资源。"));
    const tree = el("div","tree");
    drawEdges = renderTree(graph, tree);
    treeView.appendChild(tree);
    app.appendChild(makeToggle(layersView, treeView, ()=>{ if(drawEdges) drawEdges(); }));
  }
  app.appendChild(layersView);
  if(treeView){
    app.appendChild(treeView);
    ROUTE_RESIZE_HANDLER = ()=>{
      if(treeView.style.display !== "none" && drawEdges) drawEdges();
    };
    window.addEventListener("resize",ROUTE_RESIZE_HANDLER);
  }

  if(Array.isArray(data.plan) && data.plan.length){
    app.appendChild(renderPlan(data.plan, data._storage_key || data.topic));
  } else if(data.route){
    const rt = el("div","route");
    rt.appendChild(el("h2", null, "🧭 一条建议路线"));
    rt.appendChild(richP(null, data.route));
    app.appendChild(rt);
  }

  if(REFS.length) app.appendChild(renderReferences(REFS));

  const ft = el("footer");
  ft.appendChild(document.createTextNode("由 "));
  ft.appendChild(el("code", null, "knowledge-compass"));
  ft.appendChild(document.createTextNode(" 生成 · 核实状态以每条来源徽章为准"));
  app.appendChild(ft);

  if(data.topic) document.title = data.topic + " · 领域指南";
}

function bootViewer(){
  const slots = document.querySelectorAll("#kc-guide-data");
  if(slots.length !== 1){
    renderImporter("页面数据槽缺失或重复，已停止读取。请重新获取 knowledge-compass viewer 文件。",true);
    return;
  }
  // 在任何用户 JSON 进入 DOM 前封存干净骨架；导出只克隆它，不复制当前预览或工具栏。
  EXPORT_SKELETON = document.documentElement.cloneNode(true);
  const raw = slots[0].textContent || "";
  if(raw.trim() === DATA_MARKER){
    renderImporter("等待选择 JSON。所有处理都在这个浏览器标签页中完成。",false);
    return;
  }
  try {
    const data = JSON.parse(raw);
    const errors = validateGuideInBrowser(data);
    if(errors.length) throw new Error("内嵌指南未通过安全检查：\n" + errors.slice(0,8).join("\n"));
    render(data);
  } catch (error){
    renderImporter("这个 HTML 内嵌的数据已损坏或不安全：\n" + formatImportError(error) + "\n你仍可选择原始 JSON 重新生成。",true);
  }
}

bootViewer();
</script>
